<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: BC; font-weight: 700; src: url(../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-700-normal.woff2); }
@font-face { font-family: BC; font-weight: 600; src: url(../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-600-normal.woff2); }
@font-face { font-family: B; font-weight: 500; src: url(../node_modules/@fontsource/barlow/files/barlow-latin-500-normal.woff2); }
@font-face { font-family: B; font-weight: 600; src: url(../node_modules/@fontsource/barlow/files/barlow-latin-600-normal.woff2); }
@font-face { font-family: JB; font-weight: 600; src: url(../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-600-normal.woff2); }
:root { --bg: #0B0D12; --card: #13161D; --card2: #1A1E27; --line: #262B36; --text: #E8EAF0; --soft: #C3C9D4; --muted: #9AA3B2; --faint: #6B7383; --accent: #FFB547; --green: #2FD27A; --red: #FF6B6B; --blue: #4A90E2; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1600px; height: 900px; overflow: hidden; background: var(--bg); color: var(--text); font: 500 14px/1.4 B; }
.mono { font-family: JB; }
.top { height: 64px; display: flex; align-items: center; gap: 18px; padding: 0 28px; border-bottom: 1px solid var(--line); background: #0E1117; }
.brand { font: 700 24px BC; letter-spacing: .05em; color: var(--accent); }
.brand small { font: 700 11px B; letter-spacing: .14em; color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 3px 7px; margin-left: 8px; vertical-align: middle; }
.crumbs { font: 600 18px BC; letter-spacing: .04em; color: var(--muted); } .crumbs b { color: var(--text); }
.sp { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font: 600 14px B; color: var(--text); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #17120A; }
.k { font: 600 11px B; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
.panel { background: var(--card); border: 1px solid #1C2029; border-radius: 12px; padding: 16px 18px; }
h2 { margin: 0 0 10px; font: 600 20px BC; letter-spacing: .03em; }
h3 { margin: 14px 0 8px; font: 600 15px B; color: var(--soft); }
.slider { display: grid; grid-template-columns: 1fr 64px; gap: 4px 12px; margin: 10px 0 12px; }
.slider .lbl { display: flex; justify-content: space-between; font: 600 13px B; color: var(--soft); }
.slider .lbl span { color: var(--faint); font-weight: 500; }
.track { position: relative; height: 8px; border-radius: 4px; background: #232836; grid-column: 1; align-self: center; }
.track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: linear-gradient(90deg, #6B4A12, var(--accent)); }
.track b { position: absolute; top: 50%; width: 16px; height: 16px; border-radius: 50%; background: var(--text); transform: translate(-50%, -50%); box-shadow: 0 0 0 4px rgba(255,181,71,.25); }
.track .base { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--faint); }
.val { font: 600 15px JB; text-align: right; grid-row: 1 / span 2; grid-column: 2; align-self: end; }
.seg { display: flex; gap: 4px; background: #0E1117; border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
.seg span { flex: 1; text-align: center; padding: 6px 8px; border-radius: 6px; font: 600 13px B; color: var(--muted); white-space: nowrap; }
.seg span.on { background: #2A3040; color: var(--text); }
.effect { display: grid; grid-template-columns: 130px 1fr 70px; gap: 8px; align-items: center; margin: 8px 0; font: 600 13px B; color: var(--soft); }
.ebar { position: relative; height: 10px; background: #1A1E27; border-radius: 5px; }
.ebar i { position: absolute; top: 0; bottom: 0; border-radius: 5px; }
.ebar .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: var(--faint); }
.effect b { font: 600 12px JB; text-align: right; } .up { color: var(--green); } .down { color: var(--red); }
.note { background: #161A22; border-left: 3px solid var(--accent); border-radius: 6px; padding: 10px 12px; font-style: italic; color: var(--soft); }
.note .k { font-style: normal; color: var(--accent); display: block; margin-bottom: 3px; }
.tabs { display: flex; flex-direction: column; gap: 4px; }
.tabs div { padding: 11px 14px; border-radius: 8px; font: 600 15px B; color: var(--muted); display: flex; justify-content: space-between; }
.tabs div.on { background: #232836; color: var(--text); box-shadow: inset 3px 0 0 var(--accent); }
.tabs div span { font: 600 11px JB; color: var(--faint); }
.concept { position: absolute; right: 18px; bottom: 10px; font: 600 10px B; letter-spacing: .14em; color: rgba(232,234,240,.4); text-transform: uppercase; }
</style>
</head><body>
<div id="root"></div>
<script type="module">
const screen = new URLSearchParams(location.search).get("screen") || "setup";
const root = document.getElementById("root");
const slider = (label, hint, v, min, max, base, unit = "", fmt = (x) => x) => {
  const pct = ((v - min) / (max - min)) * 100, bp = ((base - min) / (max - min)) * 100;
  return `<div class="slider"><div class="lbl">${label}<span>${hint}</span></div><div class="track"><i style="width:${pct}%"></i><span class="base" style="left:${bp}%" title="baseline"></span><b style="left:${pct}%"></b></div><div class="val">${fmt(v)}${unit}</div></div>`;
};
const effect = (label, d, unit, good = d > 0) => {
  const w = Math.min(50, Math.abs(d) * 50 / 10);
  return `<div class="effect"><span>${label}</span><div class="ebar"><span class="mid"></span><i style="${d >= 0 ? `left:50%;width:${w}%` : `left:${50 - w}%;width:${w}%`};background:${good ? "#2FD27A" : "#FF6B6B"}"></i></div><b class="${good ? "up" : "down"}">${d > 0 ? "+" : ""}${d}${unit}</b></div>`;
};

async function outline(name) { const d = await (await fetch(`./t-${name}.json`)).json(); return d; }
function svgTrack(d, size, { stroke = "#E8EAF0", width = 3, corners = false, sectors = false } = {}) {
  const pts = d.points, xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  const minX = Math.min(...xs), minY = Math.min(...ys), sz = Math.max(Math.max(...xs) - minX, Math.max(...ys) - minY);
  const pad = size * 0.09, sc = (size - 2 * pad) / sz;
  const P = (x, y) => [pad + (x - minX) * sc, pad + (y - minY) * sc];
  const path = (a) => "M" + a.map(([x, y]) => P(x, y).map((v) => v.toFixed(1)).join(",")).join("L");
  let out = "";
  if (sectors) {
    const n = pts.length, cols = ["#FF6B6B", "#4A90E2", "#E7C33A"];
    for (let s = 0; s < 3; s++) out += `<path d="${path(pts.slice(Math.floor((s * n) / 3), Math.floor(((s + 1) * n) / 3) + 1))}" fill="none" stroke="${cols[s]}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round"/>`;
  } else out += `<path d="${path(pts)}Z" fill="none" stroke="${stroke}" stroke-width="${width}" stroke-linejoin="round"/>`;
  if (corners) for (const c of d.corners ?? []) { const [x, y] = P(minX + (c.p[0] / 1000) * sz, minY + (c.p[1] / 1000) * sz); out += `<g><circle cx="${x}" cy="${y}" r="10" fill="#0B0D12" stroke="#3A4050"/><text x="${x}" y="${y + 4}" text-anchor="middle" font-family="BC" font-weight="700" font-size="12" fill="#C3C9D4">${c.n}</text></g>`; }
  const [sx, sy] = P(pts[0][0], pts[0][1]);
  out += `<rect x="${sx - 5}" y="${sy - 5}" width="10" height="10" rx="2" fill="#FFFFFF"/>`;
  return out;
}

if (screen === "setup") {
  root.innerHTML = `<div class="top"><div class="brand">RACELIMIT<small>RACE</small></div><div class="crumbs">Spa-Francorchamps · Practice 2 · <b>Garage — car setup</b></div><div class="sp"></div><span class="btn">Load preset ▾</span><span class="btn">Save setup</span><span class="btn primary">Back on track →</span></div>
  <div style="display:grid;grid-template-columns:200px 1fr 1fr 430px;gap:16px;padding:18px 24px;height:836px">
    <div class="panel" style="padding:10px"><div class="tabs">
      <div class="on">Aerodynamics<span>4</span></div><div>Suspension<span>8</span></div><div>Brakes<span>4</span></div><div>Power unit<span>4</span></div><div>Differential<span>2</span></div><div>Tyres<span>4</span></div><div>Gearing<span>1</span></div></div>
      <div style="margin-top:18px;padding:10px" class="k">Presets</div>
      <div style="padding:0 10px;display:grid;gap:6px;font:600 13px B;color:#C3C9D4"><div>● Spa — low drag</div><div style="color:#9AA3B2">○ Spa — balanced</div><div style="color:#9AA3B2">○ Wet</div><div style="color:#9AA3B2">○ Your last setup</div></div>
    </div>
    <div class="panel">
      <h2>Aerodynamics</h2>
      <div class="k">Corner mode — wings closed</div>
      ${slider("Front wing angle", "more = sharper turn-in", 22, 1, 50, 26)}
      ${slider("Rear wing angle", "more = grip, less top speed", 17, 1, 50, 24)}
      <div class="k" style="margin-top:14px">Straight mode — wings open on straights</div>
      ${slider("Straight-mode drag reduction", "2026 active aero", 82, 50, 100, 80, "%")}
      <h3>Ride height</h3>
      ${slider("Front ride height", "lower = more downforce, bottoms out", 31, 25, 45, 33, " mm")}
      ${slider("Rear ride height", "sets the rake", 74, 60, 95, 78, " mm")}
      <div style="display:flex;justify-content:space-between;margin-top:6px" class="k"><span>Rake angle</span><span class="mono" style="color:#E8EAF0">1.04°</span></div>
      <h3 style="margin-top:22px">Suspension (quick view)</h3>
      ${slider("Front springs", "", 18, 1, 41, 21)}
      ${slider("Rear springs", "", 11, 1, 41, 12)}
      ${slider("Front anti-roll bar", "", 14, 1, 21, 12)}
    </div>
    <div class="panel">
      <h2>Brakes · power unit · tyres</h2>
      ${slider("Brake bias (front)", "", 56.5, 50, 62, 57, "%", (x) => x.toFixed(1))}
      ${slider("Brake pressure", "", 97, 80, 100, 100, "%")}
      <div class="lbl" style="font:600 13px B;color:#C3C9D4;margin:4px 0 6px">Brake cooling ducts</div>
      <div class="seg"><span>Closed</span><span class="on">Medium</span><span>Open</span></div>
      <h3>Power unit</h3>
      <div class="lbl" style="font:600 13px B;color:#C3C9D4;margin:4px 0 6px">Default energy (ERS) mode</div>
      <div class="seg"><span>Harvest</span><span class="on">Balanced</span><span>Attack</span><span>Qualifying</span></div>
      ${slider("Engine braking", "more = car turns in on lift", 4, 1, 10, 5)}
      ${slider("Differential on throttle", "lower = less wheelspin", 62, 50, 100, 60, "%")}
      <h3>Tyres</h3>
      ${slider("Front tyre pressure", "", 23.5, 21, 26, 23.0, " psi", (x) => x.toFixed(1))}
      ${slider("Rear tyre pressure", "lower = grip, more wear", 21.0, 19, 24, 21.5, " psi", (x) => x.toFixed(1))}
      <div class="lbl" style="font:600 13px B;color:#C3C9D4;margin:10px 0 6px">Camber · toe</div>
      <div class="seg"><span>Mild</span><span class="on">Standard</span><span>Aggressive</span></div>
    </div>
    <div style="display:grid;gap:16px;align-content:start">
      <div class="panel">
        <h2>What this does</h2>
        <div class="k" style="margin-bottom:6px">Compared with the baseline (grey marks)</div>
        ${effect("Top speed", 7, " km/h")}
        ${effect("High-speed grip", -6, "%", false)}
        ${effect("Low-speed grip", -2, "%", false)}
        ${effect("Braking stability", 3, "%")}
        ${effect("Traction", 4, "%")}
        ${effect("Rear tyre wear", -5, "%", true)}
        ${effect("Brake temperature", 4, "%", false)}
      </div>
      <div class="panel">
        <h2>Predicted lap</h2>
        <svg viewBox="0 0 390 150" width="390" height="150" id="spaMini"></svg>
        <div style="display:flex;justify-content:space-between;margin-top:8px;font:600 14px B">
          <span><span style="color:#FF6B6B">S1</span> <span class="mono up">−0.18</span></span><span><span style="color:#4A90E2">S2</span> <span class="mono down">+0.24</span></span><span><span style="color:#E7C33A">S3</span> <span class="mono up">−0.09</span></span><span>Lap <span class="mono up">−0.03</span></span>
        </div>
      </div>
      <div class="note"><span class="k">Engineer</span>Less wing helps you on Kemmel and the run to the Bus Stop, but you'll be sliding through Pouhon. Watch the rear tyres in the middle sector.</div>
    </div>
  </div><div class="concept">Design concept · car setup</div>`;
  const spa = await outline("spa");
  document.getElementById("spaMini").innerHTML = `<g transform="translate(120,0)">${svgTrack(spa, 150, { sectors: true, width: 4 })}</g>`;
}

if (screen === "weekend") {
  const spa = await outline("spa");
  const others = ["silverstone", "monza", "monte-carlo", "suzuka", "interlagos", "singapore", "zandvoort", "baku"];
  const names = { silverstone: ["Silverstone", "🇬🇧"], monza: ["Monza", "🇮🇹"], "monte-carlo": ["Monaco", "🇲🇨"], suzuka: ["Suzuka", "🇯🇵"], interlagos: ["Interlagos", "🇧🇷"], singapore: ["Singapore", "🇸🇬"], zandvoort: ["Zandvoort", "🇳🇱"], baku: ["Baku", "🇦🇿"] };
  const outs = await Promise.all(others.map(outline));
  // Spa's height profile (same rough profile as the 3D render): metres against km
  const prof = [[0, 0], [0.4, 3], [0.9, -19], [1.05, -4], [1.25, 16], [2.15, 40], [3.0, 20], [3.8, -8], [4.4, -24], [5.0, -60], [5.25, -63], [5.9, -40], [6.75, -6], [7.004, 0]];
  const W = 760, H = 210, X = (km) => 50 + (km / 7.004) * (W - 70), Y = (m) => 20 + ((45 - m) / 115) * (H - 50);
  const smooth = []; for (let km = 0; km <= 7.004; km += 0.02) { let k = 0; while (k < prof.length - 2 && prof[k + 1][0] <= km) k++; const [a, ha] = prof[k], [b, hb] = prof[k + 1], t = (km - a) / (b - a), s = t * t * (3 - 2 * t); smooth.push([km, ha + (hb - ha) * s]); }
  const area = `M${X(0)},${Y(-70)} ` + smooth.map(([k, m]) => `L${X(k).toFixed(1)},${Y(m).toFixed(1)}`).join(" ") + ` L${X(7.004)},${Y(-70)} Z`;
  const line = "M" + smooth.map(([k, m]) => `${X(k).toFixed(1)},${Y(m).toFixed(1)}`).join(" L");
  const labels = [[0.9, -19, "Eau Rouge"], [1.25, 16, "Raidillon"], [2.15, 40, "Les Combes"], [3.8, -8, "Pouhon"], [5.25, -63, "Stavelot"], [5.9, -40, "Blanchimont"], [6.75, -6, "Bus Stop"]];
  const opt = (label, items, on) => `<div style="margin:12px 0"><div class="k" style="margin-bottom:6px">${label}</div><div class="seg">${items.map((x, i) => `<span class="${i === on ? "on" : ""}">${x}</span>`).join("")}</div></div>`;
  root.innerHTML = `<div class="top"><div class="brand">RACELIMIT<small>RACE</small></div><div class="crumbs"><b>New race weekend</b></div><div class="sp"></div><span class="btn">My setups</span><span class="btn primary">Start weekend →</span></div>
  <div style="display:grid;grid-template-columns:270px 1fr 420px;gap:16px;padding:18px 24px;height:836px">
    <div class="panel" style="padding:12px;display:grid;gap:8px;align-content:start;overflow:hidden">
      <div class="k" style="padding:4px 4px 6px">Circuit · 2026 calendar</div>
      <div style="display:flex;gap:12px;align-items:center;padding:8px;border-radius:8px;background:#232836;box-shadow:inset 3px 0 0 #FFB547"><svg width="54" height="54" viewBox="0 0 54 54">${svgTrack(spa, 54, { width: 2.5, stroke: "#FFB547" })}</svg><div><b style="font:600 15px B">🇧🇪 Spa-Francorchamps</b><div class="k">7.004 km · 19 corners</div></div></div>
      ${outs.map((d, i) => `<div style="display:flex;gap:12px;align-items:center;padding:8px;border-radius:8px"><svg width="54" height="54" viewBox="0 0 54 54">${svgTrack(d, 54, { width: 2.5, stroke: "#6B7383" })}</svg><div><b style="font:600 15px B;color:#C3C9D4">${names[others[i]][1]} ${names[others[i]][0]}</b><div class="k">${(d.corners ?? []).length || "—"} corners</div></div></div>`).join("")}
    </div>
    <div style="display:grid;gap:16px;grid-template-rows:1fr auto">
      <div class="panel" style="display:grid;grid-template-columns:1fr 230px;gap:10px">
        <div><h2>Spa-Francorchamps</h2><svg width="520" height="470" viewBox="0 0 520 470"><g transform="translate(20,0)">${svgTrack(spa, 470, { sectors: true, width: 7, corners: true })}</g></svg></div>
        <div style="display:grid;gap:12px;align-content:start;padding-top:44px">
          <div><div class="k">Lap length</div><div class="mono" style="font-size:20px">7.004 km</div></div>
          <div><div class="k">Height difference</div><div class="mono" style="font-size:20px">104 m</div></div>
          <div><div class="k">Corners</div><div class="mono" style="font-size:20px">19</div></div>
          <div><div class="k">Real weather that weekend</div><div style="font:600 15px B">🌦 18°C · showers on Sunday</div></div>
          <div class="note" style="margin-top:6px"><span class="k">Elevation</span>Heights come from the real cars' position data (OpenF1 includes height), so Eau Rouge really climbs.</div>
        </div>
      </div>
      <div class="panel"><div style="display:flex;justify-content:space-between"><h2>Elevation</h2><span class="k">metres · from the start line</span></div>
        <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
          ${[-60, -30, 0, 30].map((m) => `<line x1="45" x2="${W - 10}" y1="${Y(m)}" y2="${Y(m)}" stroke="#1F2430"/><text x="38" y="${Y(m) + 4}" text-anchor="end" font-family="JB" font-size="11" fill="#6B7383">${m}</text>`).join("")}
          ${[0, 1, 2, 3, 4, 5, 6, 7].map((k) => `<text x="${X(k)}" y="${H - 6}" text-anchor="middle" font-family="JB" font-size="11" fill="#6B7383">${k} km</text>`).join("")}
          <path d="${area}" fill="rgba(255,181,71,.12)"/><path d="${line}" fill="none" stroke="#FFB547" stroke-width="2.5"/>
          ${labels.map(([k, m, t]) => `<circle cx="${X(k)}" cy="${Y(m)}" r="4" fill="#0B0D12" stroke="#FFB547" stroke-width="2"/><text x="${X(k)}" y="${Y(m) + (m > 0 ? -10 : 18)}" text-anchor="middle" font-family="B" font-weight="600" font-size="12" fill="#C3C9D4">${t}</text>`).join("")}
        </svg>
      </div>
    </div>
    <div class="panel" style="overflow:hidden">
      <h2>Race settings</h2>
      ${opt("Weekend", ["Practice", "Qualifying", "Sprint", "Race"], 3)}
      ${opt("Race length", ["5 laps", "25%", "50%", "Full · 44"], 1)}
      ${opt("Weather", ["Real (2026)", "Dry", "Changeable", "Wet"], 0)}
      <div style="margin:12px 0"><div class="k" style="margin-bottom:6px">Opponents · 2026 grid</div>${slider("AI skill", "", 88, 50, 110, 90)}${slider("AI aggression", "", 60, 0, 100, 50)}</div>
      ${opt("Damage", ["Off", "Cosmetic", "Full"], 2)}
      ${opt("Race control", ["Off", "Lenient", "Real"], 2)}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font:600 13px B;color:#C3C9D4;margin:10px 0">
        <span>✓ Flags & safety cars</span><span>✓ Track limits & penalties</span><span>✓ Tyre wear · real</span><span>✓ Energy use · real</span><span>✓ Pit stops</span><span>○ Mechanical failures</span></div>
      ${opt("Assists", ["None", "Some", "Lots"], 1)}
    </div>
  </div><div class="concept">Design concept · race weekend</div>`;
}

if (screen === "pit") {
  const cars = [["VER", "#3671C6", 0.02], ["NOR", "#FF8000", 0.06], ["LEC", "#E8002D", 0.12], ["RUS", "#27F4D2", 0.14], ["ALO", "#229971", 0.155], ["HAM", "#E8002D", 0.21], ["ANT", "#27F4D2", 0.31], ["GAS", "#FF87BC", 0.38], ["SAI", "#1868DB", 0.47], ["PIA", "#FF8000", 0.52]];
  const R = 120, cx = 150, cy = 150, ang = (f) => -Math.PI / 2 + f * Math.PI * 2;
  const dot = (f, c, t, ring = R) => { const x = cx + Math.cos(ang(f)) * ring, y = cy + Math.sin(ang(f)) * ring; return `<circle cx="${x}" cy="${y}" r="9" fill="${c}" stroke="#0B0D12" stroke-width="2"/><text x="${cx + Math.cos(ang(f)) * (ring + 24)}" y="${y + 4}" text-anchor="middle" font-family="B" font-weight="600" font-size="11" fill="#C3C9D4">${t}</text>`; };
  const tyre = (c, col, name, laps, note, on) => `<div style="flex:1;padding:12px;border-radius:10px;background:${on ? "#232836" : "#161A22"};border:2px solid ${on ? "#FFB547" : "transparent"};display:grid;gap:4px;justify-items:center"><span style="width:44px;height:44px;border-radius:50%;border:5px solid ${col};display:grid;place-items:center;font:700 16px B">${c}</span><b style="font:600 14px B">${name}</b><span class="k">${laps}</span><span style="font:600 12px B;color:#9AA3B2">${note}</span></div>`;
  root.innerHTML = `<div style="position:absolute;inset:0;background:url(./bg-race.png) center/cover;filter:blur(3px) brightness(.45)"></div>
  <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1180px;display:grid;grid-template-columns:1fr 360px;gap:16px">
    <div class="panel" style="background:rgba(19,22,29,.94)">
      <div style="display:flex;align-items:center;gap:12px"><h2 style="margin:0">Pit stop — lap 12</h2><span class="k" style="color:#2FD27A">● Box this lap</span><div class="sp"></div><span class="k">Pit lane loss at Spa <span class="mono" style="color:#E8EAF0">19.8s</span></span></div>
      <div class="k" style="margin:16px 0 8px">New tyres</div>
      <div style="display:flex;gap:10px">${tyre("S", "#FF5A5A", "Soft", "new · 1 set", "~11 laps here", false)}${tyre("M", "#FFD23F", "Medium", "used 3 laps", "~19 laps", false)}${tyre("H", "#E8EAF0", "Hard", "new · 1 set", "~27 laps — to the end", true)}${tyre("I", "#3DDC97", "Inter", "new · 2 sets", "rain in 8 laps?", false)}${tyre("W", "#4A90E2", "Wet", "new · 2 sets", "", false)}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px">
        <div><div class="k" style="margin-bottom:6px">Front wing</div><div class="seg"><span>−2</span><span class="on">−1 turn</span><span>0</span><span>+1</span><span>+2</span></div><div style="font:600 12px B;color:#9AA3B2;margin-top:6px">One turn off: faster on the Kemmel straight, a little less grip through Pouhon.</div></div>
        <div><div class="k" style="margin-bottom:6px">Repairs</div><div style="display:flex;gap:8px"><span class="btn" style="flex:1;border-color:#FF6B6B">✓ New front wing <span class="mono" style="color:#FF8A8A">+2.5s</span></span></div><div style="font:600 12px B;color:#9AA3B2;margin-top:6px">Front wing −16%: costing you ~0.3s a lap.</div></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid #262B36">
        <div><div class="k">Stationary</div><div class="mono" style="font-size:22px">2.4s + 2.5s</div></div>
        <div><div class="k">Total stop</div><div class="mono" style="font-size:22px">24.7s</div></div>
        <div><div class="k">Rejoin</div><div class="mono" style="font-size:22px;color:#FFB547">P9</div><div style="font:600 12px B;color:#9AA3B2">between ANT and GAS, 1.4s clear</div></div>
        <div><div class="k">Undercut on ALO</div><div class="mono" style="font-size:22px;color:#2FD27A">+1.1s</div><div style="font:600 12px B;color:#9AA3B2">if he stops next lap</div></div>
      </div>
      <div class="k" style="margin:18px 0 8px">Strategy from here</div>
      <div style="display:grid;gap:6px">
        ${[["Plan A", "M → H (1 stop)", "P6", "best", "#2FD27A"], ["Plan B", "M → S → S (2 stops)", "P7", "+3.8s", "#9AA3B2"], ["Plan C", "Stay out, M → I if it rains", "P5–P10", "gamble", "#E7C33A"]].map(([a, b, c, d, col], i) => `<div style="display:grid;grid-template-columns:80px 1fr 80px 90px;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;background:${i === 0 ? "#232836" : "#161A22"}"><b style="font:600 14px B;color:${i === 0 ? "#FFB547" : "#C3C9D4"}">${a}</b><span>${b}</span><span class="mono">${c}</span><span class="mono" style="color:${col};text-align:right">${d}</span></div>`).join("")}
      </div>
      <div style="display:flex;gap:10px;margin-top:18px"><span class="btn primary" style="flex:1;justify-content:center">Confirm — box this lap</span><span class="btn" style="width:200px;justify-content:center">Stay out</span></div>
    </div>
    <div class="panel" style="background:rgba(19,22,29,.94)">
      <h2>Where you'll come out</h2>
      <svg width="320" height="320" viewBox="-10 -10 320 320">
        <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#262B36" stroke-width="18"/>
        <path d="M${cx + Math.cos(ang(0.3)) * R},${cy + Math.sin(ang(0.3)) * R} A${R},${R} 0 0 1 ${cx + Math.cos(ang(0.4)) * R},${cy + Math.sin(ang(0.4)) * R}" fill="none" stroke="rgba(255,181,71,.35)" stroke-width="18"/>
        ${cars.map(([t, c, f]) => dot(f, c, t)).join("")}
        <circle cx="${cx + Math.cos(ang(0.17)) * R}" cy="${cy + Math.sin(ang(0.17)) * R}" r="9" fill="#FFB547" stroke="#0B0D12" stroke-width="2"/>
        <circle cx="${cx + Math.cos(ang(0.345)) * R}" cy="${cy + Math.sin(ang(0.345)) * R}" r="10" fill="none" stroke="#FFB547" stroke-width="3" stroke-dasharray="4 3"/>
        <path d="M${cx + Math.cos(ang(0.19)) * (R - 26)},${cy + Math.sin(ang(0.19)) * (R - 26)} A${R - 26},${R - 26} 0 0 1 ${cx + Math.cos(ang(0.33)) * (R - 26)},${cy + Math.sin(ang(0.33)) * (R - 26)}" fill="none" stroke="#FFB547" stroke-width="2" stroke-dasharray="5 4"/>
        <text x="${cx}" y="${cy - 6}" text-anchor="middle" font-family="BC" font-weight="700" font-size="22" fill="#E8EAF0">P6 → P9</text>
        <text x="${cx}" y="${cy + 16}" text-anchor="middle" font-family="B" font-weight="600" font-size="12" fill="#9AA3B2">after a 24.7s stop</text>
      </svg>
      <div style="font:600 13px B;color:#9AA3B2">Solid dot: you now. Dashed ring: where you'll rejoin. The same "circle of doom" as the live timing.</div>
      <div class="note" style="margin-top:14px"><span class="k">Engineer</span>Hards to the end. ALO is struggling on his mediums — we'll get him back with the fresher tyres.</div>
    </div>
  </div><div class="concept">Design concept · pit stop & strategy</div>`;
}
document.title = "done";
</script>
</body></html>
