<!doctype html><html><head><meta charset="utf-8"><title>Teaser poster</title>
<style>
@font-face { font-family: BC; font-weight: 700; src: url(../../../public/vendor/fonts/barlow-condensed-latin-700-normal.woff2); }
@font-face { font-family: BC; font-weight: 600; src: url(../../../public/vendor/fonts/barlow-condensed-latin-600-normal.woff2); }
@font-face { font-family: B; font-weight: 600; src: url(../../../public/vendor/fonts/barlow-latin-600-normal.woff2); }
@font-face { font-family: B; font-weight: 500; src: url(../../../public/vendor/fonts/barlow-latin-500-normal.woff2); }
@font-face { font-family: JB; font-weight: 600; src: url(../../../public/vendor/fonts/jetbrains-mono-latin-600-normal.woff2); }
:root { --paper: #EDE8DC; --amber: #FFA51F; --ink: #0B0D12; --soft: rgba(237,232,220,.72); --faint: rgba(237,232,220,.45); }
* { box-sizing: border-box; margin: 0; }
html, body { background: var(--ink); overflow: hidden; }
#P { position: relative; overflow: hidden; color: var(--paper); font: 500 16px B; }
.L { position: absolute; }
.img { position: absolute; inset: 0; background-size: cover; background-position: center; }
.title { font: 700 1px/0.8 BC; letter-spacing: -.01em; text-transform: uppercase; color: var(--paper); white-space: nowrap; }
.mono { font: 600 13px/1.35 JB; letter-spacing: .06em; text-transform: uppercase; text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 12px rgba(0,0,0,.7); }
.wm { display: flex; align-items: center; gap: 12px; font: 700 40px/1 BC; letter-spacing: .06em; color: var(--amber); }
.wm small { font: 700 13px/1 B; letter-spacing: .2em; color: var(--paper); border: 1.5px solid var(--paper); padding: 5px 8px 4px; }
.frame { position: absolute; inset: 22px; border: 1.5px solid rgba(237,232,220,.35); pointer-events: none; }
.reg { position: absolute; width: 26px; height: 26px; }
.reg::before, .reg::after { content: ""; position: absolute; background: rgba(237,232,220,.7); }
.reg::before { left: 12px; top: 0; width: 1.5px; height: 26px; } .reg::after { top: 12px; left: 0; height: 1.5px; width: 26px; }
.reg i { position: absolute; inset: 6px; border: 1.5px solid rgba(237,232,220,.7); border-radius: 50%; }
.sheet { display: grid; gap: 14px; }
.cell .pic { background-size: cover; background-position: center; border: 1px solid rgba(237,232,220,.25); position: relative; }
.cell .pic b { position: absolute; left: 0; top: 0; background: var(--ink); color: var(--amber); font: 600 12px/1 JB; padding: 5px 6px; }
.cell .cap { margin-top: 7px; color: var(--soft); }
.rule { height: 1.5px; background: rgba(237,232,220,.35); }
.grain { position: absolute; inset: 0; pointer-events: none; opacity: .16; mix-blend-mode: overlay; }
.call { position: absolute; color: var(--paper); }
</style></head><body><div id="P"></div>
<script>
const size = new URLSearchParams(location.search).get("size") || "w";
const W = { w: 1920, p: 1080, s: 1080 }[size], H = { w: 1080, p: 1350, s: 1920 }[size];
const P = document.getElementById("P"); P.style.width = W + "px"; P.style.height = H + "px";
const frames = [["l7-stack", "Pit stops"], ["l8-classic", "Cars from 1998 to 2026"], ["l6-safetycar", "Safety car"], ["l8-parade", "Drivers' parade"], ["l7-flypast", "Flypasts"], ["s-podium", "The podium"]];
const grain = `<svg class="grain" width="${W}" height="${H}"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.6 -.3"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>`;
const reg = (x, y) => `<div class="reg" style="left:${x - 13}px;top:${y - 13}px"><i></i></div>`;
const sheet = (cols, cw, ch) => `<div class="sheet" style="grid-template-columns:repeat(${cols},${cw}px)">${frames.map(([f, c], i) => `<div class="cell"><div class="pic" style="width:${cw}px;height:${ch}px;background-image:url(bg/${f}.png)"><b>${String(i + 1).padStart(2, "0")}</b></div><div class="cap mono">${c}</div></div>`).join("")}</div>`;
const wm = `<div class="wm">RACELIMIT<small>RACE</small></div>`;
const feats = `25 real circuits &nbsp;·&nbsp; night races &nbsp;·&nbsp; pit stops &nbsp;·&nbsp; made-up teams`;
const fine = `Concept renders from the game in development.<br>All teams, drivers and sponsors are made up.`;
const hero = `bg/p-hero-${size}.png`, car = `bg/p-car-${size}.png`;
const shade = { w: "linear-gradient(180deg, rgba(11,13,18,.75) 0%, rgba(11,13,18,.1) 26%, rgba(11,13,18,0) 62%, rgba(11,13,18,.92) 82%, #0B0D12 100%)",
  p: "linear-gradient(180deg, rgba(11,13,18,.8) 0%, rgba(11,13,18,.15) 22%, rgba(11,13,18,0) 50%, rgba(11,13,18,.92) 67%, #0B0D12 72%)",
  s: "linear-gradient(180deg, rgba(11,13,18,.85) 0%, rgba(11,13,18,.6) 14%, rgba(11,13,18,.15) 22%, rgba(11,13,18,0) 52%, rgba(11,13,18,.92) 67%, #0B0D12 71%)" }[size];
const L = {
  w: { title: `<div class="L title" style="left:58px;top:300px;font-size:330px">Coming soon</div>`,
    top: `<div class="L" style="left:64px;top:56px">${wm}<div class="mono" style="color:var(--amber);font-size:15px;margin-top:16px">${feats}</div></div><div class="L mono" style="right:64px;top:62px;color:var(--soft)">Teaser · 01</div>`,
    mid: `<div class="L mono" style="left:64px;top:770px;color:var(--soft);font-size:12px">Fig. 01 — night race, street circuit</div>`,
    bottom: `<div class="L" style="left:64px;bottom:80px">${sheet(6, 284, 156)}</div><div class="L mono" style="left:64px;bottom:44px;color:var(--faint);font-size:11px">${fine.replace("<br>", " ")}</div>` },
  p: { title: `<div class="L title" style="left:46px;top:226px;font-size:270px;line-height:.8">Coming<br>soon</div>`,
    top: `<div class="L" style="left:52px;top:56px">${wm}<div class="mono" style="color:var(--amber);font-size:13px;margin-top:14px">${feats}</div></div><div class="L mono" style="right:52px;top:64px;color:var(--soft)">Teaser · 01</div>`,
    mid: "",
    bottom: `<div class="L" style="left:52px;bottom:86px">${sheet(3, 312, 150)}</div><div class="L mono" style="left:52px;bottom:46px;color:var(--faint);font-size:10.5px">${fine.replace("<br>", " ")}</div>` },
  s: { title: `<div class="L title" style="left:44px;top:390px;font-size:356px;line-height:.8">Coming<br>soon</div>`,
    top: `<div class="L" style="left:52px;top:236px">${wm}<div class="mono" style="color:var(--amber);font-size:14px;margin-top:16px">${feats}</div></div><div class="L mono" style="right:52px;top:244px;color:var(--soft)">Teaser · 01</div>`,
    mid: `<div class="L mono" style="left:52px;top:1270px;color:var(--soft);font-size:12px">Fig. 01 — night race, street circuit</div>`,
    bottom: `<div class="L" style="left:52px;bottom:252px">${sheet(3, 312, 150)}</div><div class="L mono" style="left:52px;bottom:196px;color:var(--faint);font-size:11px">${fine.replace("<br>", " ")}</div>` },
}[size];
const an = window.__AN || {};
P.innerHTML = `<div class="img" style="background-image:url(${hero});filter:saturate(.9) contrast(1.05) brightness(.74)"></div>
  <div class="img" style="background:${shade}"></div>
  ${L.title}
  <div class="img" style="background-image:url(${car});filter:saturate(.92) contrast(1.06)"></div>
  ${L.top}${L.mid}${L.bottom}
  <div class="frame"></div>${reg(22, 22)}${reg(W - 22, 22)}${reg(22, H - 22)}${reg(W - 22, H - 22)}
  ${grain}`;
</script></body></html>
