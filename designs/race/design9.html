<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: BC; font-weight: 700; src: url(../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-700-normal.woff2); }
@font-face { font-family: BC; font-weight: 600; src: url(../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-600-normal.woff2); }
@font-face { font-family: B; font-weight: 500; src: url(../node_modules/@fontsource/barlow/files/barlow-latin-500-normal.woff2); }
@font-face { font-family: B; font-weight: 600; src: url(../node_modules/@fontsource/barlow/files/barlow-latin-600-normal.woff2); }
@font-face { font-family: JB; font-weight: 600; src: url(../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-600-normal.woff2); }
:root { --bg: #0B0D12; --card: #13161D; --card2: #1A1E27; --line: #262B36; --text: #E8EAF0; --soft: #C3C9D4; --muted: #9AA3B2; --faint: #6B7383; --accent: #FFB547; --good: #2FD27A; --bad: #FF6B6B; --blue: #5AA9FF; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1600px; height: 900px; overflow: hidden; background: var(--bg); color: var(--text); font: 500 14px/1.4 B; }
.top { height: 64px; display: flex; align-items: center; gap: 18px; padding: 0 28px; border-bottom: 1px solid var(--line); background: #0E1117; }
.brand { font: 700 24px BC; letter-spacing: .05em; color: var(--accent); } .brand small { font: 700 11px B; letter-spacing: .14em; color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 3px 7px; margin-left: 8px; vertical-align: middle; }
.crumbs { font: 600 18px BC; letter-spacing: .04em; color: var(--muted); } .crumbs b { color: var(--text); } .sp { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font: 600 14px B; color: var(--text); white-space: nowrap; } .btn.primary { background: var(--accent); border-color: var(--accent); color: #17120A; }
.k { font: 600 11px B; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
.panel { background: var(--card); border: 1px solid #1C2029; border-radius: 12px; padding: 16px 18px; min-width: 0; }
h2 { margin: 0 0 8px; font: 600 22px BC; letter-spacing: .03em; }
.chip { display: inline-flex; gap: 6px; align-items: center; padding: 4px 10px; border-radius: 14px; background: #1C2230; font: 600 12px B; color: var(--soft); white-space: nowrap; }
.mono { font-family: JB; font-weight: 600; }
.bar { height: 8px; border-radius: 4px; background: #232836; overflow: hidden; } .bar i { display: block; height: 100%; border-radius: 4px; }
.row { display: flex; align-items: center; gap: 10px; }
.concept { position: absolute; right: 18px; bottom: 10px; font: 600 10px B; letter-spacing: .14em; color: rgba(232,234,240,.4); text-transform: uppercase; }
.grid { display: grid; gap: 16px; padding: 18px 24px; }
table { border-collapse: collapse; width: 100%; } td { padding: 7px 6px; border-top: 1px solid #1F2430; font: 600 14px B; } td.r { text-align: right; }
.slider { display: grid; grid-template-columns: 130px 1fr 54px; gap: 12px; align-items: center; font: 600 13px B; color: var(--soft); }
.slider .track { height: 6px; border-radius: 3px; background: #2A2F3B; position: relative; } .slider .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); } .slider .track b { position: absolute; top: 50%; width: 16px; height: 16px; border-radius: 50%; background: #E8EAF0; transform: translate(-50%, -50%); box-shadow: 0 0 0 3px rgba(0,0,0,.4); }
.key { font: 600 11px JB; color: #0B0D12; background: #C3C9D4; border-radius: 3px; padding: 2px 6px; }
.bgimg{position:absolute;inset:0;background-size:cover;background-position:center}
.hudbox{position:absolute;background:rgba(11,13,18,.8);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 14px}
.lbl2{font:600 10px B;letter-spacing:.14em;color:#9AA3B2;text-transform:uppercase}
.pill{display:inline-block;padding:3px 9px;border-radius:12px;font:700 11px B;letter-spacing:.06em}
.sl{display:grid;grid-template-columns:120px 1fr 60px;gap:10px;align-items:center;font:600 13px B;color:#C3C9D4}
.sl .tr{height:6px;border-radius:3px;background:#2A2F3B;position:relative}.sl .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#FFB547}.sl .tr b{position:absolute;top:50%;width:15px;height:15px;border-radius:50%;background:#E8EAF0;transform:translate(-50%,-50%)}
.tg{display:flex;gap:4px;flex-wrap:wrap}.tg span{padding:4px 9px;border-radius:12px;background:#1C2230;font:600 12px B;color:#C3C9D4}.tg span.on{background:#2A2310;color:#FFB547;box-shadow:inset 0 0 0 1px #FFB547}
</style>
</head><body><div id="root"></div>
<script type="module">
const screen = new URLSearchParams(location.search).get("screen") || "slip";
const root = document.getElementById("root");
const top = (crumb, right = "") => `<div class="top"><div class="brand">RACELIMIT<small>RACE</small></div><div class="crumbs">${crumb}</div><div class="sp"></div>${right}</div>`;
const sl = (label, v, txt) => `<div class="sl"><span>${label}</span><div class="tr"><i style="width:${v}%"></i><b style="left:${v}%"></b></div><span class="mono" style="text-align:right">${txt}</span></div>`;
const tg = (opts, on) => `<div class="tg">${opts.map((o, i) => `<span class="${i === on ? "on" : ""}">${o}</span>`).join("")}</div>`;
const hb = (cells) => `<div class="hudbox" style="left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:0;padding:0;overflow:hidden;white-space:nowrap">${cells.map((c, i) => `<div style="padding:10px 16px;${i ? "border-left:1px solid rgba(255,255,255,.07)" : ""};display:grid;gap:2px;align-content:center">${c}</div>`).join("")}</div>`;
const gear = (g, v) => `<div style="display:flex;gap:10px;align-items:end"><span style="font:700 46px/0.8 BC;color:#FFB547">${g}</span><div><div class="mono" style="font-size:22px">${v}</div><div class="lbl2">km/h</div></div></div>`;
const t2 = (a, b) => `<div style="font:600 13px B">${a}</div><div style="font:600 11px B;color:#9AA3B2">${b}</div>`;
const note = (k, title, lines, pos = "left:18px;top:18px") => `<div class="hudbox" style="${pos};width:420px"><div class="lbl2" style="color:#FFB547">${k}</div><div style="font:700 25px BC;margin:3px 0 6px">${title}</div><div style="display:grid;gap:5px;font:500 14px/1.4 B;color:#C3C9D4">${lines.map((l) => `<div>${l}</div>`).join("")}</div></div>`;
const concept = (t) => `<div class="concept" style="text-shadow:0 1px 4px #000">${t}</div>`;
let html = "";

if (screen === "slip") {
  html = `<div class="bgimg" style="background-image:url(x-slip.png)"></div>
  <div style="position:absolute;left:870px;top:410px;transform:translate(-50%,-100%)" class="hudbox"><span class="pill" style="background:#10213A;color:#7FC4FF">TOW</span> <b class="mono">+11 km/h</b> <span style="color:#9AA3B2;font:600 12px B">· 0.4 s behind</span></div>
  ${note("Slipstream & dirty air", "Close behind = faster on straights, slower in corners", ["On a straight the car in front punches a hole in the air: you get up to <b style='color:#7FC4FF'>+12 km/h</b> when you're within about 1 s.", "In corners the turbulent air behind it takes away grip, mostly at the front: the car understeers and the tyres heat up.", "So you hang back a little through the corners, then close in for the straight."])}
  <div class="hudbox" style="right:18px;top:18px;width:330px"><div class="lbl2" style="margin-bottom:8px">Air you're in</div>
    <svg width="300" height="190" viewBox="0 0 300 190"><rect x="0" y="0" width="300" height="190" rx="10" fill="#0E1117"/>
      <path d="M150,30 L120,180 L180,180 Z" fill="#5AA9FF" opacity=".25"/><text x="188" y="150" fill="#7FC4FF" font-family="B" font-weight="700" font-size="12">TOW (straight)</text>
      <path d="M150,30 C110,70 70,100 30,150 L70,175 C100,130 130,90 150,60Z" fill="#FF6B6B" opacity=".25"/><text x="20" y="128" fill="#FF8A8A" font-family="B" font-weight="700" font-size="12">DIRTY AIR</text><text x="20" y="143" fill="#FF8A8A" font-family="B" font-weight="700" font-size="12">(corners)</text>
      <rect x="141" y="8" width="18" height="32" rx="5" fill="#16245C" stroke="#7FC4FF"/><rect x="141" y="120" width="18" height="32" rx="5" fill="#FFA51F"/><text x="165" y="141" fill="#FFB547" font-family="B" font-weight="700" font-size="12">YOU</text></svg>
    <div style="display:grid;gap:6px;margin-top:8px;font:600 13px B"><div style="display:flex;justify-content:space-between"><span>Top speed</span><b style="color:#7FC4FF">+11 km/h</b></div><div style="display:flex;justify-content:space-between"><span>Front grip</span><b style="color:#9AA3B2">—  (straight)</b></div><div style="display:flex;justify-content:space-between"><span>In the next corner</span><b style="color:#FF8A8A">−18% front grip</b></div></div></div>
  ${hb([gear(8, 318), `<div class="lbl2">Air</div><div style="width:160px;height:8px;border-radius:4px;background:linear-gradient(90deg,#FF6B6B,#3A4150 45%,#3A4150 55%,#5AA9FF);position:relative"><i style="position:absolute;left:84%;top:-4px;bottom:-4px;width:3px;background:#E8EAF0;border-radius:2px"></i></div><div style="display:flex;justify-content:space-between;width:160px;font:600 10px B;color:#9AA3B2"><span>dirty</span><span>clean</span><span>tow</span></div>`, t2("Gap ahead <span class=mono>0.41</span>", "AXIOM #1 · overtake mode ready"), `<span class="pill" style="background:#2A2310;color:#FFB547">OT READY</span><div style="font:600 11px B;color:#9AA3B2">press O at the end of the straight</div>`])}
  ${concept("Concept render · slipstream and dirty air")}`;
}

if (screen === "lift") {
  html = `<div class="bgimg" style="background-image:url(x-lift.png)"></div>
  <div style="position:absolute;left:712px;top:438px;transform:translate(-50%,-100%)" class="hudbox"><span class="pill" style="background:#10213A;color:#7FC4FF">LIFT HERE</span> <span style="font:600 12px B;color:#9AA3B2">then coast to the 100 board</span></div>
  ${note("Lift and coast", "Ease off early to save fuel and battery", ["A blue line on the track shows where to lift off the throttle. You coast to the braking point, then brake as normal.", "Three short beeps count you down to the line; one long beep means lift now.", "Each lift costs about 0.05 s but saves fuel and charges the battery a little."])}
  <div class="hudbox" style="right:18px;top:18px;width:320px"><div class="lbl2" style="margin-bottom:8px">This lap</div>
    <div style="display:grid;gap:7px;font:600 13px B"><div style="display:flex;justify-content:space-between"><span>Fuel target</span><b style="color:#FFB547">−0.3 laps</b></div><div style="display:flex;justify-content:space-between"><span>Lift points</span><b>4 of 6 done</b></div><div style="display:flex;justify-content:space-between"><span>Saved so far</span><b style="color:#6EE7A8">0.12 kg · 140 kJ</b></div><div style="display:flex;justify-content:space-between"><span>Time cost</span><b class="mono">+0.18 s</b></div></div>
    <div class="lbl2" style="margin:12px 0 6px">Show it as</div>${tg(["Off", "Line on track", "Line + beeps", "Beeps only"], 2)}
    <div class="lbl2" style="margin:12px 0 6px">When</div>${tg(["Only when short", "Always", "Engineer decides"], 0)}</div>
  ${hb([gear(8, 312), `<div class="lbl2">Lift in</div><div style="display:flex;gap:8px;align-items:center"><b class="mono" style="font-size:20px;color:#7FC4FF">45 m</b><span style="display:flex;gap:3px">${[1, 1, 0].map((on) => `<i style="width:10px;height:10px;border-radius:50%;background:${on ? "#7FC4FF" : "#2A2F3B"}"></i>`).join("")}</span><span>🔊</span></div>`, t2("Fuel <span class=mono style='color:#FF8A8A'>−0.3</span> lap", "need to save 0.3 laps by the end"), t2("Battery <span class=mono>61%</span>", "coasting charges it")])}
  ${concept("Concept render · lift and coast")}`;
}

if (screen === "glow") {
  const bt = [["FL", 980, "#FFD08A"], ["FR", 960, "#FFC070"], ["RL", 640, "#FF8A3A"], ["RR", 620, "#FF8A3A"]];
  html = `<div class="bgimg" style="background-image:url(x-glow.png)"></div>
  ${note("Brake glow", "The discs glow when they're hot", ["Carbon brakes run at 400–1000 °C. Under heavy braking they glow orange, brightest at night or onboard.", "The glow fades down the next straight as they cool.", "Too cold and they don't grip; too hot and they fade. Brake cooling is a setting in the garage."], "left:18px;top:18px")}
  <div class="hudbox" style="right:18px;top:18px;width:300px"><div class="lbl2" style="margin-bottom:8px">Brake temperatures</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${bt.map(([n, t, c]) => `<div style="border-radius:10px;padding:8px;text-align:center;background:${c}22;box-shadow:inset 0 0 0 1px ${c}"><b>${n}</b><div class="mono" style="font-size:18px;color:${c}">${t}°</div></div>`).join("")}</div>
    <div style="margin-top:10px;height:8px;border-radius:4px;background:linear-gradient(90deg,#3A3632,#7A2A10 35%,#FF6A1A 70%,#FFE0A0)"></div><div style="display:flex;justify-content:space-between;font:600 10px B;color:#9AA3B2;margin-top:3px"><span>200°</span><span>600°</span><span>1000°</span></div>
    <div class="lbl2" style="margin:12px 0 6px">Brake cooling (setup)</div>${tg(["Small", "Medium", "Large"], 1)}</div>
  ${hb([gear(3, 98), t2("Braking <span class=mono>4.8 g</span>", "Turn 1 · La Source"), `<span class="pill" style="background:#2A1A10;color:#FFB060">FRONT BRAKES HOT</span><div style="font:600 11px B;color:#9AA3B2">980° · OK for one more lap</div>`])}
  ${concept("Concept render · brake glow at night")}`;
}

if (screen === "tod") {
  const pics = [["x-day.png", "19:40", "Race start", "Bright sun, track 41°, most grip"], ["x-sunset.png", "20:25", "Sunset", "Sun low in your eyes on some straights, track cools, grip goes up a little"], ["clean-night.png", "20:55", "Night", "Floodlights on, track 29°, sparks and brake glow easy to see"]];
  html = top("Race settings · <b>Time of day</b>", `<span class="chip">Lights switch on by themselves as it gets dark</span>`) + `
  <div class="grid" style="grid-template-columns:repeat(3,1fr);grid-template-rows:auto 1fr;height:836px">
    ${pics.map(([f, t, a, b]) => `<div class="panel" style="padding:0;overflow:hidden"><div style="height:330px;background:url(${f}) center/cover"></div><div style="padding:12px 16px"><div style="display:flex;gap:10px;align-items:baseline"><b class="mono" style="font-size:22px;color:#FFB547">${t}</b><b style="font:600 18px B">${a}</b></div><div style="font:500 14px B;color:#C3C9D4;margin-top:4px">${b}</div></div></div>`).join("")}
    <div class="panel" style="grid-column:span 3;display:grid;grid-template-columns:1.4fr 1fr;gap:26px">
      <div style="display:grid;gap:10px;align-content:start"><h2 style="margin:0">During the race</h2>
        <div style="position:relative;height:56px;border-radius:12px;background:linear-gradient(90deg,#9CC6EA 0%,#F2C27A 48%,#E06A3A 60%,#2A2550 72%,#0A0E1A 100%)">${[["19:40", 0, "start", 0], ["20:25", 50, "sunset", 0], ["20:31", 57, "track lights on", 1], ["21:10", 100, "finish", 0]].map(([t, x, l, r2]) => `<div style="position:absolute;left:${x}%;top:-6px;bottom:${r2 ? -26 : -6}px;width:2px;background:#E8EAF0;transform:translateX(${x === 100 ? -2 : 0}px)"></div><div style="position:absolute;left:${x}%;top:${r2 ? 84 : 64}px;${r2 ? "padding-left:8px;" : ""}transform:translateX(${x === 100 ? "-100%" : x === 0 || r2 ? "0" : "-50%"});font:600 12px B;color:#C3C9D4;white-space:nowrap"><b class="mono" style="color:#E8EAF0">${t}</b> ${l}</div>`).join("")}</div>
        <div style="height:40px"></div>
        <svg width="100%" height="120" viewBox="0 0 860 120" preserveAspectRatio="none" style="display:block"><g stroke="#262B36"><line x1="0" x2="860" y1="20" y2="20"/><line x1="0" x2="860" y1="60" y2="60"/><line x1="0" x2="860" y1="100" y2="100"/></g>
          <path d="M0,22 C200,26 360,40 430,58 C520,80 640,92 860,98" fill="none" stroke="#FF8A3A" stroke-width="3"/><path d="M0,96 C220,94 380,86 430,78 C520,64 640,50 860,44" fill="none" stroke="#6EE7A8" stroke-width="3" stroke-dasharray="7 5"/>
          <text x="6" y="14" fill="#FF8A3A" font-family="B" font-weight="600" font-size="13">Track 41°</text><text x="780" y="92" fill="#FF8A3A" font-family="B" font-weight="600" font-size="13">29°</text><text x="700" y="38" fill="#6EE7A8" font-family="B" font-weight="600" font-size="13">grip +3%</text></svg>
        <div style="font:500 14px B;color:#C3C9D4">Track temperature drops as the sun goes down, so tyre grip and wear change during the race. Your engineer warns you when the sun will be in your eyes.</div></div>
      <div style="display:grid;gap:10px;align-content:start"><h2 style="margin:0">Settings</h2>
        <div class="lbl2">Start time</div>${tg(["Real time for that race", "Morning", "Afternoon", "Before sunset", "Night"], 3)}
        <div class="lbl2">Time speed</div>${tg(["Real", "×2", "×4", "×10", "Frozen"], 2)}
        <div class="lbl2">Sun in your eyes</div>${tg(["Real glare", "Softer", "Off"], 0)}
        <div class="lbl2">Track lights</div>${tg(["Come on when it gets dark", "Always on", "Off"], 0)}
        <div style="font:500 13px B;color:#9AA3B2;margin-top:4px">At ×4 the clock runs four times faster, so a 25-minute race covers 90 minutes: daylight to full dark. Lights fade up over about 30 seconds, pole by pole.</div></div>
    </div></div>${concept("Concept renders · time of day")}`;
}

if (screen === "camedit") {
  html = top("Settings · <b>Camera editor</b>", `<span class="chip">Changes show live · saved per car era</span><span class="btn">Reset</span><span class="btn primary">Save</span>`) + `
  <div style="position:absolute;left:24px;top:82px;width:1040px;height:585px;border-radius:12px;overflow:hidden;background:url(x-ck.png) center/cover;box-shadow:0 0 0 1px #262B36">
    <svg width="1040" height="585" style="position:absolute;inset:0"><g stroke="rgba(255,255,255,.22)"><line x1="347" x2="347" y1="0" y2="585"/><line x1="693" x2="693" y1="0" y2="585"/><line x1="0" x2="1040" y1="195" y2="195"/><line x1="0" x2="1040" y1="390" y2="390"/></g><g stroke="#FFB547" stroke-width="2"><line x1="510" x2="530" y1="292" y2="292"/><line x1="520" x2="520" y1="282" y2="302"/></g></svg>
    <div class="hudbox" style="left:14px;top:14px;padding:6px 12px;font:600 12px B">Cockpit · 2026 cars · <span style="color:#FFB547">editing</span></div>
    <div class="hudbox" style="right:14px;bottom:14px;padding:6px 12px;font:600 12px B;color:#C3C9D4">Drag to move the seat · scroll for field of view · WASD to nudge</div>
  </div>
  <div style="position:absolute;left:24px;top:682px;width:1040px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px">
    ${[["Cockpit", 112, 36, 1, "edited"], ["T-cam", 104, 22, 0, "default"], ["Nose", 172, 44, 0, "default"], ["Near chase", 30, 18, 0, "edited"], ["Far chase", 8, 6, 0, "default"]].map(([t, cx, cy, on, st]) => `<div class="panel" style="padding:0;overflow:hidden;${on ? "box-shadow:0 0 0 2px #FFB547" : ""}"><svg width="100%" height="100" viewBox="0 0 196 70" style="display:block;background:#0E1117"><path d="M38,54 L44,44 L70,42 L86,38 L100,30 L112,30 L120,38 L150,40 L172,44 L186,50 L186,54 Z" fill="#2A2F3B"/><rect x="36" y="30" width="6" height="16" fill="#2A2F3B"/><circle cx="62" cy="52" r="10" fill="#1A1D24" stroke="#3A4150" stroke-width="2"/><circle cx="160" cy="52" r="10" fill="#1A1D24" stroke="#3A4150" stroke-width="2"/><line x1="0" x2="196" y1="62.5" y2="62.5" stroke="#262B36"/><circle cx="${cx}" cy="${cy}" r="5" fill="${on ? "#FFB547" : "#7FC4FF"}"/><circle cx="${cx}" cy="${cy}" r="9" fill="none" stroke="${on ? "#FFB547" : "#7FC4FF"}" opacity=".4"/></svg><div style="padding:7px 10px;display:flex;justify-content:space-between;font:600 13px B;color:${on ? "#FFB547" : "#E8EAF0"}"><span>${t}</span><span style="font:600 11px B;color:#9AA3B2">${st}</span></div></div>`).join("")}
  </div>
  <div class="panel" style="position:absolute;right:24px;top:82px;width:480px;bottom:20px;display:grid;gap:9px;align-content:start;overflow:hidden">
    <div class="lbl2">Quick presets</div>${tg(["Driver's eyes", "Higher view", "TV onboard", "Wide (sense of speed)"], 0)}
    <div class="lbl2" style="margin-top:6px">Seat position</div>
    ${sl("Forward / back", 46, "−14 cm")}${sl("Up / down", 38, "−4 cm")}${sl("Left / right", 50, "0 cm")}
    <div class="lbl2" style="margin-top:6px">Lens</div>
    ${sl("Field of view", 58, "66°")}${sl("Tilt", 44, "−3°")}
    <div class="lbl2" style="margin-top:6px">Head movement</div>
    ${sl("Leans in corners", 60, "60%")}${sl("Shakes on kerbs", 40, "40%")}${sl("Looks to the apex", 30, "30%")}
    <div class="lbl2" style="margin-top:6px">Show</div>
    <div style="display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;font:600 13px B">

      <div style="font:500 12px B;color:#9AA3B2">A new event every Monday at 8 am. Some are lap times, some are races, some are puzzles like fuel saving.</div>
