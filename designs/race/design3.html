<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: BC; font-weight: 700; src: url(../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-700-normal.woff2); }
@font-face { font-family: BC; font-weight: 600; src: url(../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-600-normal.woff2); }
@font-face { font-family: B; font-weight: 500; src: url(../node_modules/@fontsource/barlow/files/barlow-latin-500-normal.woff2); }
@font-face { font-family: B; font-weight: 600; src: url(../node_modules/@fontsource/barlow/files/barlow-latin-600-normal.woff2); }
@font-face { font-family: JB; font-weight: 600; src: url(../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-600-normal.woff2); }
:root { --bg: #0B0D12; --card: #13161D; --card2: #1A1E27; --line: #262B36; --text: #E8EAF0; --soft: #C3C9D4; --muted: #9AA3B2; --faint: #6B7383; --accent: #FFB547; --good: #2FD27A; --bad: #FF6B6B; --blue: #5AA9FF; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1600px; height: 900px; overflow: hidden; background: var(--bg); color: var(--text); font: 500 14px/1.4 B; }
.top { height: 64px; display: flex; align-items: center; gap: 18px; padding: 0 28px; border-bottom: 1px solid var(--line); background: #0E1117; }
.brand { font: 700 24px BC; letter-spacing: .05em; color: var(--accent); } .brand small { font: 700 11px B; letter-spacing: .14em; color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 3px 7px; margin-left: 8px; vertical-align: middle; }
.crumbs { font: 600 18px BC; letter-spacing: .04em; color: var(--muted); } .crumbs b { color: var(--text); } .sp { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font: 600 14px B; color: var(--text); white-space: nowrap; } .btn.primary { background: var(--accent); border-color: var(--accent); color: #17120A; }
.k { font: 600 11px B; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
.panel { background: var(--card); border: 1px solid #1C2029; border-radius: 12px; padding: 16px 18px; min-width: 0; }
h2 { margin: 0 0 8px; font: 600 22px BC; letter-spacing: .03em; }
.chip { display: inline-flex; gap: 6px; align-items: center; padding: 4px 10px; border-radius: 14px; background: #1C2230; font: 600 12px B; color: var(--soft); white-space: nowrap; }
.mono { font-family: JB; font-weight: 600; }
.bar { height: 8px; border-radius: 4px; background: #232836; overflow: hidden; } .bar i { display: block; height: 100%; border-radius: 4px; }
.row { display: flex; align-items: center; gap: 10px; }
.concept { position: absolute; right: 18px; bottom: 10px; font: 600 10px B; letter-spacing: .14em; color: rgba(232,234,240,.4); text-transform: uppercase; }
.grid { display: grid; gap: 16px; padding: 18px 24px; }
table { border-collapse: collapse; width: 100%; } td { padding: 7px 6px; border-top: 1px solid #1F2430; font: 600 14px B; } td.r { text-align: right; }
.slider { display: grid; grid-template-columns: 130px 1fr 54px; gap: 12px; align-items: center; font: 600 13px B; color: var(--soft); }
.slider .track { height: 6px; border-radius: 3px; background: #2A2F3B; position: relative; } .slider .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); } .slider .track b { position: absolute; top: 50%; width: 16px; height: 16px; border-radius: 50%; background: #E8EAF0; transform: translate(-50%, -50%); box-shadow: 0 0 0 3px rgba(0,0,0,.4); }
.key { font: 600 11px JB; color: #0B0D12; background: #C3C9D4; border-radius: 3px; padding: 2px 6px; }
</style>
</head><body><div id="root"></div>
<script type="module">
const screen = new URLSearchParams(location.search).get("screen") || "beat";
const root = document.getElementById("root");
const top = (crumb, right = "") => `<div class="top"><div class="brand">RACELIMIT<small>RACE</small></div><div class="crumbs">${crumb}</div><div class="sp"></div>${right}</div>`;
const slider = (label, v, txt) => `<div class="slider"><span>${label}</span><div class="track"><i style="width:${v}%"></i><b style="left:${v}%"></b></div><span class="mono" style="text-align:right">${txt}</span></div>`;

async function track(name) {
  const d = await (await fetch(`./${name}.json`)).json();
  const pts = d.points; const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  const minX = Math.min(...xs), minY = Math.min(...ys), sz = Math.max(Math.max(...xs) - minX, Math.max(...ys) - minY);
  const maxY = Math.max(...ys); return { pts: pts.map(([x, y]) => [(x - minX) / sz, (maxY - y) / sz]), corners: d.corners ?? [], raw: d, minX, minY, sz };
}
const pathOf = (pts, w, h, pad = 20) => { const s = Math.min(w, h) - pad * 2; return pts.map(([x, y], i) => `${i ? "L" : "M"}${(pad + x * s).toFixed(1)},${(pad + y * s).toFixed(1)}`).join("") + "Z"; };

// a lap simulation from the track's curvature: speed limited by grip, then by acceleration and braking
function lapSim(t, { grip = 4.6, brake = 45, acc = 13 } = {}) {
  const LAP = t.lap ?? 7004, N = 700, P = [];
  // resample to N points by distance
  const pts = t.pts, seg = []; let tot = 0; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; const d = Math.hypot(b[0] - a[0], b[1] - a[1]); seg.push(d); tot += d; }
  for (let k = 0; k < N; k++) { let want = (k / N) * tot, i = 0; while (want > seg[i]) { want -= seg[i]; i++; } const a = pts[i], b = pts[(i + 1) % pts.length], f = want / seg[i]; P.push([a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]); }
  const ds = LAP / N, curv = P.map((p, k) => { const a = P[(k - 6 + N) % N], b = P[(k + 6) % N]; const h1 = Math.atan2(p[1] - a[1], p[0] - a[0]), h2 = Math.atan2(b[1] - p[1], b[0] - p[0]); let d = h2 - h1; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return Math.abs(d) / (12 * ds); });
  const vmax = curv.map((c) => Math.min(92, Math.sqrt((grip * 9.81) / Math.max(c, 1e-5))));
  const v = vmax.slice();
  for (let r = 0; r < 2; r++) { for (let k = 1; k < 2 * N; k++) { const i = k % N, j = (k - 1) % N; v[i] = Math.min(v[i], Math.sqrt(v[j] ** 2 + 2 * acc * (1 - v[j] / 100) * ds)); } for (let k = 2 * N - 2; k >= 0; k--) { const i = k % N, j = (k + 1) % N; v[i] = Math.min(v[i], Math.sqrt(v[j] ** 2 + 2 * brake * ds)); } }
  const thr = v.map((s, i) => { const n = v[(i + 1) % N]; return n < s - 0.05 ? 0 : s >= vmax[i] - 0.5 && s < 90 ? 55 : 100; });
  const brk = v.map((s, i) => (v[(i + 1) % N] < s - 0.05 ? 100 : 0));
  const time = []; let T = 0; for (let i = 0; i < N; i++) { time.push(T); T += ds / v[i]; }
  return { P, v: v.map((s) => s * 3.6), thr, brk, time, total: T, N };
}
const fmt = (t) => `${Math.floor(t / 60)}:${(t % 60).toFixed(3).padStart(6, "0")}`;
function lines(series, w, h, { min = 0, max = 350, colors = [], fill = false, zero = false } = {}) {
  const N = series[0].length, X = (i) => (i / (N - 1)) * w, Y = (v) => h - ((v - min) / (max - min)) * h;
  return `<svg width="${w}" height="${h}" style="display:block;overflow:visible">${zero ? `<line x1="0" x2="${w}" y1="${Y(0)}" y2="${Y(0)}" stroke="#3A4150" stroke-dasharray="4 4"/>` : ""}${series.map((s, k) => `<path d="${s.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("")}" fill="none" stroke="${colors[k]}" stroke-width="${k ? 1.6 : 2}" ${fill ? "" : ""}/>`).join("")}</svg>`;
}

if (screen === "beat") {
  const t = await track("spa"); t.lap = 7004;
  const pro = lapSim(t, { grip: 4.8, brake: 47, acc: 13.5 }), me = lapSim(t, { grip: 4.45, brake: 39, acc: 13.2 });
  const K = 104.92 / pro.total; for (const r of [pro, me]) { r.time = r.time.map((x) => x * K); r.total *= K; }
  const delta = me.time.map((x, i) => x - pro.time[i]);
  const gain = delta.map((d, i) => d - (delta[i - 1] ?? 0));
  const W = 520, s = W - 40, X = (p) => 20 + p[0] * s, Y = (p) => 20 + p[1] * s;
  const seg = pro.P.map((p, i) => { const q = pro.P[(i + 1) % pro.N], g = gain[i] * 900; const c = g > 0.25 ? "#FF6B6B" : g < -0.25 ? "#2FD27A" : "#5A6273"; return `<line x1="${X(p)}" y1="${Y(p)}" x2="${X(q)}" y2="${Y(q)}" stroke="${c}" stroke-width="7" stroke-linecap="round"/>`; }).join("");
  const corners = (t.raw.corners ?? []).filter((c) => [1, 2, 3, 5, 8, 10, 12, 15, 18, 19].includes(c.n)).map((c) => { const x = 20 + ((c.p[0] - 0) / 1) * 0; return c; });
  const cx = (c) => 20 + ((c.p[0] * t.raw.cv?.s ?? c.p[0])); void cx; void corners;
  root.innerHTML = top("Beat the driver · Spa-Francorchamps · <b>Your best vs VER's fastest race lap</b>", `<span class="btn">Watch their lap as a ghost</span><span class="btn primary">Race the ghost again</span>`) + `
  <div class="grid" style="grid-template-columns:560px 1fr;height:836px">
    <div class="panel" style="display:grid;gap:12px;align-content:start">
      <div class="row" style="justify-content:space-between"><div><div class="k">You</div><div class="mono" style="font-size:30px">${fmt(me.total)}</div></div><div style="text-align:center"><div class="k">Gap</div><div class="mono" style="font-size:30px;color:#FF6B6B">+${(me.total - pro.total).toFixed(3)}</div></div><div style="text-align:right"><div class="k">VER · real telemetry</div><div class="mono" style="font-size:30px;color:#5AA9FF">${fmt(pro.total)}</div></div></div>
      <svg width="${W}" height="${W - 10}" viewBox="0 0 ${W} ${W}">${seg}</svg>
      <div class="row" style="gap:16px;font:600 12px B;color:#9AA3B2"><span><i style="display:inline-block;width:18px;height:6px;border-radius:3px;background:#2FD27A;vertical-align:middle"></i> you're faster</span><span><i style="display:inline-block;width:18px;height:6px;border-radius:3px;background:#FF6B6B;vertical-align:middle"></i> you lose time</span><span><i style="display:inline-block;width:18px;height:6px;border-radius:3px;background:#5A6273;vertical-align:middle"></i> about even</span></div>
    </div>
    <div style="display:grid;gap:16px;grid-template-rows:auto auto auto 1fr;min-width:0">
      <div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="k">Gap over the lap (s)</span><span class="k" style="color:#FF6B6B">+ = behind</span></div>${lines([delta], 930, 90, { min: Math.min(0, ...delta) - 0.05, max: Math.max(...delta) + 0.05, colors: ["#FFB547"], zero: true })}</div>
      <div class="panel"><div class="row" style="gap:18px;margin-bottom:8px"><span class="k">Speed (km/h)</span><span class="chip" style="background:#2A2310;color:#FFB547">— You</span><span class="chip" style="background:#10213A;color:#5AA9FF">— VER</span></div>${lines([me.v, pro.v], 930, 150, { min: 60, max: 340, colors: ["#FFB547", "#5AA9FF"] })}</div>
      <div class="panel" style="display:grid;grid-template-columns:1fr 1fr;gap:18px"><div><div class="k" style="margin-bottom:6px">Throttle %</div>${lines([me.thr, pro.thr], 445, 60, { min: 0, max: 105, colors: ["#FFB547", "#5AA9FF"] })}</div><div><div class="k" style="margin-bottom:6px">Brake</div>${lines([me.brk, pro.brk], 445, 60, { min: 0, max: 105, colors: ["#FFB547", "#5AA9FF"] })}</div></div>
      <div class="panel"><div class="k" style="margin-bottom:8px">Where the time goes</div>
        ${[["La Source", "You brake 22 m earlier", "−0.14 s"], ["Eau Rouge / Raidillon", "Min speed 9 km/h lower — lift is too big", "−0.21 s"], ["Bus Stop", "Good: later braking than VER", "+0.05 s"], ["Pouhon", "Back on throttle 0.3 s later", "−0.12 s"]].map(([c, w, d]) => `<div class="row" style="padding:7px 0;border-top:1px solid #1F2430"><b style="width:190px">${c}</b><span style="flex:1;color:#C3C9D4">${w}</span><span class="mono" style="color:${d.startsWith("+") ? "#2FD27A" : "#FF6B6B"}">${d}</span></div>`).join("")}
      </div>
    </div>
  </div><div class="concept">Design concept · Beat the driver (example data)</div>`;
}

if (screen === "career") {
  root.innerHTML = top("Career · <b>Season 2 · Round 15 of 24</b>", `<span class="chip">RaceLimit Racing · P8 in constructors</span><span class="btn primary">Go to Monza →</span>`) + `
  <div class="grid" style="grid-template-columns:1.25fr 1fr 1fr;grid-template-rows:auto 1fr;height:836px">
    <div class="panel" style="grid-row:span 2;display:grid;gap:14px;align-content:start">
      <h2>Car development</h2>
      <div class="row" style="justify-content:space-between"><span class="k">Budget cap</span><span class="mono">$96.4M <span style="color:#6B7383">/ $135M</span></span></div>
      <div class="bar"><i style="width:71%;background:linear-gradient(90deg,#FFB547,#FF8A3D)"></i></div>
      <div style="font:500 13px B;color:#9AA3B2;margin-top:-6px">Go over and you lose development time next season.</div>
      ${[["Floor v3", "Aero · +0.18 s/lap", 62, "In production · ready at Monza", "#2FD27A"], ["Low-drag rear wing", "Aero · for Monza and Las Vegas", 100, "Ready · fitted", "#5AA9FF"], ["Sidepod rework", "Aero + cooling · +0.11 s/lap", 24, "In the wind tunnel · 3 races", "#FFB547"], ["Brake cooling", "Reliability · fewer DNFs in heat", 0, "Not started · $3.2M", "#6B7383"], ["Lighter gearbox casing", "Weight · −2.1 kg", 0, "Not started · $4.8M", "#6B7383"]].map(([n, d, p, st, c]) => `<div style="background:#181C25;border-radius:10px;padding:12px 14px;display:grid;gap:6px"><div class="row" style="justify-content:space-between"><b style="font:600 16px B">${n}</b><span style="font:600 12px B;color:${c}">${st}</span></div><div style="font:500 13px B;color:#9AA3B2">${d}</div><div class="bar" style="height:6px"><i style="width:${p}%;background:${c}"></i></div></div>`).join("")}
      <div class="row" style="gap:8px;flex-wrap:wrap"><span class="chip">Wind tunnel hours: 312 / 360 this period</span><span class="chip">P8 = more tunnel time than the top teams</span></div>
    </div>
    <div class="panel" style="display:grid;gap:10px;align-content:start">
      <h2>Power unit allocation</h2>
      ${[["Engine (ICE)", 3, 4], ["Turbo", 3, 4], ["MGU-K", 2, 4], ["Energy store", 2, 2], ["Control electronics", 1, 2]].map(([n, u, m]) => `<div class="row"><span style="width:150px;font:600 14px B">${n}</span><span style="display:flex;gap:4px;flex:1">${Array.from({ length: m }, (_, i) => `<i style="flex:1;height:10px;border-radius:3px;background:${i < u ? (u >= m ? "#FF6B6B" : "#FFB547") : "#262B36"}"></i>`).join("")}</span><span class="mono" style="width:40px;text-align:right">${u}/${m}</span></div>`).join("")}
      <div style="font:500 13px B;color:#FFB0B0;background:#2A1517;border-radius:8px;padding:8px 10px">Energy store is at the limit: one more = 10-place grid penalty. Take it at Monza where overtaking is easy?</div>
    </div>
    <div class="panel" style="display:grid;gap:10px;align-content:start">
      <h2>Drivers & offers</h2>
      ${[["You", "P11 in standings · 34 pts", "Contract to end of season 3", "#FFB547"], ["Team-mate · M. Okafor", "P14 · 21 pts · you lead qualifying 9–5", "Contract ends this year", "#9AA3B2"]].map(([n, a, b, c]) => `<div style="background:#181C25;border-radius:10px;padding:10px 12px"><b style="color:${c}">${n}</b><div style="font:500 13px B;color:#C3C9D4">${a}</div><div style="font:500 12px B;color:#6B7383">${b}</div></div>`).join("")}
      <div style="background:#10213A;border:1px solid #2A4A7A;border-radius:10px;padding:10px 12px"><div class="k" style="color:#5AA9FF">New offer</div><b>AXIOM wants you for next year</b><div style="font:500 13px B;color:#C3C9D4">2-year deal · their car is ~0.4 s/lap faster · decide before Round 18</div></div>
    </div>
    <div class="panel" style="grid-column:span 2;display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div><h2>Next: Italian Grand Prix</h2><div style="font:500 14px B;color:#C3C9D4">Monza · low downforce · 53 laps</div>
        <div style="display:grid;gap:6px;margin-top:10px">${[["Board's target", "Points finish (top 10)"], ["Weather", "Dry, 27 °C · 10% chance of rain on Sunday"], ["Tyres", "C3 · C4 · C5"], ["Sprint weekend", "No"]].map(([a, b]) => `<div class="row"><span class="k" style="width:130px">${a}</span><span style="font:600 14px B">${b}</span></div>`).join("")}</div></div>
      <div><h2>Constructors</h2><table>${[["6", "VELOCE", 141], ["7", "KESTREL", 102], ["8", "RACELIMIT", 55, 1], ["9", "NOVA", 49], ["10", "HALCYON", 18]].map(([p, n, pts, me]) => `<tr style="${me ? "color:#FFB547" : ""}"><td class="mono" style="width:30px">${p}</td><td>${n}</td><td class="r mono">${pts}</td></tr>`).join("")}</table></div>
    </div>
  </div><div class="concept">Design concept · Career mode</div>`;
}

if (screen === "moments") {
  const M = [
    ["2000", "Belgium · Spa", "Pass for the lead on Kemmel", "Häkkinen went one side of a backmarker and Schumacher the other. You have 4 laps to make the same move.", 3, "#FF8000", "V10 era", "t-spa"],
    ["2008", "Brazil · Interlagos", "The last two corners", "Rain on the final lap and the title depends on one place. Get past the car on dry tyres before the line.", 3, "#E8002D", "V8 era", "t-interlagos"],
    ["2011", "Canada · Montréal", "From last to the win", "After six pit stops and a two-hour red flag you're at the back. 30 laps, a drying track — win it.", 3, "#E8002D", "KERS & DRS", null],
    ["2016", "Brazil · Interlagos", "Master of the wet", "Heavy rain, late stop for intermediates, 16th with 16 laps left. Finish on the podium.", 2, "#3671C6", "Hybrid turbo", "t-interlagos"],
    ["2020", "Italy · Monza", "Hold on for the first win", "You're leading with a faster car right behind and 6 laps to go. Defend without making a mistake.", 2, "#5AA9FF", "Wide & fast", "t-monza"],
    ["2020", "Sakhir · Outer loop", "Last on lap 1, first at the flag", "Contact at Turn 4 drops you to last. 87 laps on the short outer loop to come back and win.", 2, "#FF6EB4", "Wide & fast", null],
  ];
  const maps = {}; for (const m of M) if (m[7] && !maps[m[7]]) maps[m[7]] = await track(m[7]);
  root.innerHTML = top("<b>Famous moments</b> · jump into real races at the moment that mattered", `<span class="chip">14 of 40 completed</span><span class="btn">Filter by era</span>`) + `
  <div class="grid" style="grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);height:836px">
  ${M.map(([y, place, t, d, stars, c, era, map]) => `<div class="panel" style="display:grid;grid-template-rows:auto 1fr auto;gap:10px;position:relative;overflow:hidden;background:linear-gradient(160deg,${c}22,#13161D 55%)">
    ${map ? `<svg style="position:absolute;right:-10px;top:30px;opacity:.22" width="230" height="230"><path d="${pathOf(maps[map].pts, 230, 230)}" fill="none" stroke="${c}" stroke-width="5" stroke-linejoin="round"/></svg>` : ""}
    <div><div class="row" style="justify-content:space-between"><span style="font:700 46px/1 BC;color:${c}">${y}</span><span class="chip">${era}</span></div><div class="k" style="margin-top:4px">${place}</div></div>
    <div style="position:relative"><h2 style="font-size:26px;margin-bottom:6px">${t}</h2><div style="font:500 14px/1.45 B;color:#C3C9D4;max-width:360px">${d}</div></div>
    <div class="row" style="justify-content:space-between"><span style="color:#FFB547;letter-spacing:2px">${"★".repeat(stars)}<span style="color:#3A4150">${"★".repeat(3 - stars)}</span></span><span class="btn" style="height:34px">Play</span></div></div>`).join("")}
  </div><div class="concept">Design concept · Famous moments — challenges inspired by real races</div>`;
}

if (screen === "friends") {
  const P = [["kris", "Host · wheel", "#FFB547", "Ready"], ["mila_r", "Controller", "#5AA9FF", "Ready"], ["T0BY", "Keyboard", "#2FD27A", "Picking car…"], ["jaxon.f1", "Wheel", "#FF6EB4", "Ready"], ["ari", "Controller", "#C3C9D4", "Ready"], ["+ 3 AI cars", "fill the grid", "#6B7383", ""]];
  root.innerHTML = top("With friends · <b>Room RL-7K2Q</b>", `<span class="btn">Copy invite link</span><span class="btn primary">Start race (5/8 ready)</span>`) + `
  <div class="grid" style="grid-template-columns:1fr 1fr 420px;height:836px">
    <div class="panel" style="display:grid;gap:10px;align-content:start">
      <h2>Drivers</h2>
      ${P.map(([n, d, c, st]) => `<div class="row" style="background:#181C25;border-radius:10px;padding:10px 12px"><span style="width:36px;height:36px;border-radius:50%;background:${c}33;color:${c};display:grid;place-items:center;font:700 16px BC">${n[0].toUpperCase()}</span><div style="flex:1"><b>${n}</b><div style="font:500 12px B;color:#9AA3B2">${d}</div></div><span style="font:600 13px B;color:${st === "Ready" ? "#2FD27A" : "#FFB547"}">${st}</span></div>`).join("")}
